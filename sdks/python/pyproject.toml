[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapticchain"
version = "0.1.0"
description = "Python SDK for SynapticChain blockchain - wallet integration and dApp development"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "SynapticChain Team", email = "dev@synaptyx.xyz" }
]
maintainers = [
    { name = "SynapticChain Team", email = "dev@synaptyx.xyz" }
]
keywords = [
    "blockchain",
    "cryptocurrency",
    "sdk",
    "synapticchain",
    "synapse",
    "wallet",
    "dapp",
    "web3",
    "ed25519",
    "bech32m",
    "layer1",
    "smart-contracts",
    "rpc",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "pynacl>=1.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.82.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/synapticchain/synapticchain"
Documentation = "https://docs.synaptyx.xyz/sdk/python"
Repository = "https://github.com/synapticchain/synapticchain"
Issues = "https://github.com/synapticchain/synapticchain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/synapticchain"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["synapticchain"]
